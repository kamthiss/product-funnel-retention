services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      TZ: UTC
      PGTZ: UTC
    command: postgres -c timezone=UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.64.2.8
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3000:3000"
    volumes:
      - mbdata:/metabase-data
    depends_on:
      - db

volumes:
  pgdata:
  mbdata:
